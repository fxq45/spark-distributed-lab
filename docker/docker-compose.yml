services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-local:3.5.8
    container_name: spark-master
    hostname: spark-master
    command: >
      bash -c "
        $${SPARK_HOME}/sbin/start-master.sh --host spark-master --port 7077 --webui-port 8080 &&
        tail -f $${SPARK_HOME}/logs/*master*
      "
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master Port
      - "4040:4040"   # Spark Application UI
    volumes:
      - ../src:/opt/spark-apps
      - ../data:/opt/spark-data
    networks:
      - spark-network

  spark-worker-1:
    image: spark-local:3.5.8
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: >
      bash -c "
        $${SPARK_HOME}/sbin/start-worker.sh spark://spark-master:7077 --memory 1G --cores 2 --webui-port 8081 &&
        tail -f $${SPARK_HOME}/logs/*worker*
      "
    ports:
      - "8081:8081"
    volumes:
      - ../src:/opt/spark-apps
      - ../data:/opt/spark-data
    depends_on:
      - spark-master
    networks:
      - spark-network

  spark-worker-2:
    image: spark-local:3.5.8
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: >
      bash -c "
        $${SPARK_HOME}/sbin/start-worker.sh spark://spark-master:7077 --memory 1G --cores 2 --webui-port 8081 &&
        tail -f $${SPARK_HOME}/logs/*worker*
      "
    ports:
      - "8082:8081"
    volumes:
      - ../src:/opt/spark-apps
      - ../data:/opt/spark-data
    depends_on:
      - spark-master
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
